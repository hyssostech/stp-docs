name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sdk-source-updated]
  # The SDK lives in another repository, so a change there does not push here.
  # The dispatch above is the immediate path, but it needs a cross-repo PAT in
  # sketch-thru-plan-sdk-js - and that credential class is exactly what froze
  # this site for six months when it expired (2026-02-26 to 2026-09-04).
  # This schedule is the credential-free floor: even with no PAT anywhere, the
  # API reference is never more than a day behind the SDK source.
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC - off the hour to avoid the rush
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checkout the JS SDK source for TypeDoc API reference generation.
      # PUBLIC repo, so NO token: this checkout used to point at the private
      # hyssostech/stp-js with secrets.STP_JS_PAT, and when that PAT expired the
      # docs silently stopped deploying for six months (2026-02-26 -> 2026-09-04).
      # The SDK source now lives here, so the credential is gone for good.
      - name: Checkout JS SDK source
        uses: actions/checkout@v4
        with:
          repository: hyssostech/sketch-thru-plan-sdk-js
          path: .stp-js

      # Checkout the .NET SDK source to regenerate its API reference. Public repo,
      # so no PAT is needed (unlike stp-js above).
      - name: Checkout sketch-thru-plan-sdk-net source
        uses: actions/checkout@v4
        with:
          repository: hyssostech/sketch-thru-plan-sdk-net
          path: .sdk-net

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # XMLDoc2Markdown turns the assembly + its XML doc file into Docusaurus-ready
      # markdown. Pinned so the docs build cannot change shape under us.
      - name: Generate .NET API reference
        run: |
          set -euo pipefail
          # publish, NOT build: a library build leaves only StpSDK.dll + JMSML.dll in
          # bin/, so the generator cannot resolve Newtonsoft.Json et al and SILENTLY
          # skips the core types (StpRecognizer, StpJsonRpcConnector, the services).
          # publish copies every dependency alongside, and generation goes 72/9-failed
          # -> 87/0-failed.
          # The TFM is DERIVED from the csproj, not written here. It used to say
          # `-f net8.0`; sdk-net moved to net10.0 and this build failed with
          # NETSDK1005 ("doesn't have a target for 'net8.0'") on the very next
          # scheduled run, after seven consecutive green days. A framework named
          # in ANOTHER repository's workflow is a framework nobody there will
          # remember to update - no gate in either SDK repo can see this file.
          project=.sdk-net/src/StpSDK.JsonRpc/StpSDK.csproj
          tfms="$(grep -o '<TargetFrameworks>[^<]*' "$project" | head -n 1 | cut -d'>' -f2)"
          tfm="$(echo "$tfms" | tr ';' '\n' | grep -v '^netstandard' | head -n 1 || true)"
          if [ -z "$tfm" ]; then
            echo "::error::no non-netstandard TargetFramework in $project (got '$tfms')"
            exit 1
          fi
          echo "publishing $project for $tfm"
          dotnet publish "$project" -c Release -f "$tfm" -o .sdk-net-publish
          dotnet tool install --global XMLDoc2Markdown --version 6.0.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          rm -rf docs/api-net && mkdir -p docs/api-net
          cd .sdk-net-publish
          xmldoc2md StpSDK.dll --output "$GITHUB_WORKSPACE/docs/api-net"
          cd "$GITHUB_WORKSPACE"
          # Normalise intra-doc links AND guard against a silent collapse: a short run
          # means the assembly or its dependencies failed to load, and the site would
          # otherwise deploy with the .NET API reference quietly missing.
          node scripts/normalize-net-api-links.mjs docs/api-net

      - name: Install dependencies
        run: npm ci

      - name: Build website
        env:
          STP_JS_PATH: ./.stp-js
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
